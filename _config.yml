# Jekyll configuration for GitHub Pages
title: Joshua Passmore
description: Attempting to turn coffee into theorems
author: "If you want to get in touch, then send me a mail:"
email: josh@aims.ac.za
url: https://joshuapassmore.github.io
baseurl: ""

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Markdown processor
markdown: kramdown

# Feed settings
feed:
  path: feed.xml
  collections:
    posts:
      path: /feed/posts.xml
